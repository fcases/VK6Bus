syntax = "proto2";

package ProtocolBus.Config;

option optimize_for = SPEED;

message AppConfig 
{
	optional bool ActivateTrace=1 [default=false];
	optional int32 TraceLevel=2 [default=0];
	repeated DomainCfg Domain=3;
};

message DomainCfg 
{
	required int32 Id=1;
	required bool ActivateDefaultTransport=2 [ default = false ];
	optional bool DirectDispacthToSubs=3 [ default = false ];
	optional string KeyFile=4;			// Generated by KeyAdmin "Me@myComputer_20120525150544.pbusk"
	repeated TransportDef Transport=5;
	optional CrossConnectorDef CrossConnector=6;
}

message TransportDef 
{
	required string TransportName = 1 [ default = "MCastDefault0" ];
	required string DllImport = 2 [ default = "Default" ];
	required string TransportClass =3 [ default = "Default" ];
	optional bool ReceiveOwnMsgs=4 [ default = false ];
	optional MCastDefConfig  MCastParams=5;			 // Default Transport
	optional BCastDefConfig BCastParams=6;
	optional UDPStarDefConfig UDPStarParams=7;
	
	extensions 4000 to 5000;
}

message MCastDefConfig 
{ 
// DllImport: "Default"  
// TransportClass: "Multicast" or "Default"
	
	required string LocalAddress=1 [default ="Any"]; // Listening interface: "Any","Loopback","v.x.y.z"
	required string MCastAddress=2 [ default = "239.255.0.1" ];
	required int32 Port=3 [ default = 40069 ];		 // Listening and Sending endpoint Port 
	optional int32 TTL=4 [default = 1 ];
	optional int32 ReceiveBuffer=5 [ default = 134217727 ];
	optional int32 SendBuffer=6 [ default = 134217727 ];
}

message BCastDefConfig 
{ 
// DllImport: "Default"  
// TransportClass: "Broadcast"
  
	required string LocalAddress=1 [default ="Any"]; // Listening interface: "Any","Loopback","v.x.y.z"
	required string BCastAddress=2 [ default = "192.168.2.255" ];
	required int32 Port=3 [ default = 40069 ];		 // Listening and Sending endpoint Port 
	optional int32 ReceiveBuffer=4 [ default = 134217727 ];
	optional int32 SendBuffer=5 [ default = 134217727 ];
}

message UDPStarDefConfig 
{ 
// DllImport: "Default"  
// TransportClass: "UDPStar"
  
	required string LocalAddress=1 [default ="Any"]; // Listening interface: "Any","Loopback","v.x.y.z"
	required int32 Port=2 [ default = 40069 ];		 // Only listening endpoint Port 
	repeated EndPointDef EndPoint=3;
	optional int32 ReceiveBuffer=4 [ default = 134217727 ];
	optional int32 SendBuffer=5 [ default = 134217727 ];
}

message EndPointDef
{
	required string Host =1;
	required int32 Port =2 [ default = 40069 ];
}

message CrossConnectorDef
{
	repeated string Transport=1;
}
